version: "3.9"

# ==============================================================
# CyberSec AI Platform — Orquestación Completa
# Servicios: nginx, api, worker, beat, postgres, redis, ollama, frontend
# ==============================================================

x-api-base: &api-base
  build:
    context: ./backend
    dockerfile: ../docker/Dockerfile.backend
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - cybersec-net

services:

  # ---- Reverse Proxy ----
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    networks:
      - cybersec-net

  # ---- FastAPI Backend ----
  api:
    <<: *api-base
    container_name: cybersec-api
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Celery Worker ----
  worker:
    <<: *api-base
    container_name: cybersec-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - api
      - redis

  # ---- Celery Beat (tareas programadas) ----
  beat:
    <<: *api-base
    container_name: cybersec-beat
    command: celery -A app.core.celery_app beat --loglevel=info

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: cybersec-db
    env_file: .env
    environment:
      POSTGRES_USER: cybersec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersec}
      POSTGRES_DB: cybersec
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersec -d cybersec"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cybersec-net

  # ---- Redis ----
  redis:
    image: redis:7.4-alpine
    container_name: cybersec-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-cybersec} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - cybersec-net

  # ---- Ollama (IA Soberana) ----
  ollama:
    image: ollama/ollama:latest
    container_name: cybersec-ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    # GPU NVIDIA (requiere nvidia-container-toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - cybersec-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Frontend (React + Vite build) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: cybersec-frontend
    volumes:
      - frontend_dist:/app/dist
    networks:
      - cybersec-net

# ---- Volumes ----
volumes:
  postgres_data:
  redis_data:
  ollama_models:
  frontend_dist:

# ---- Networks ----
networks:
  cybersec-net:
    driver: bridge
